server.port=8080
spring.application.name=University Platform SOA
cxf.path=/services

# Compte admin Camunda (valeurs de démo, surchargeables par variables d'environnement)
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:admin}
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:admin123}

# Base H2 en mémoire (utilisée par le moteur Camunda)
spring.datasource.url=jdbc:h2:mem:university_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.root=INFO
